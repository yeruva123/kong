name: Kong API Onboarding with Deck

on: 
  workflow_dispatch:   # allow manual trigger

env:
  # Adjust these to match your environment
  OPENAPI_SPEC: sample-api.yaml
  KONG_STATE_FILE: kong/generated-kong.yaml
  SELECT_TAG: sample-api          # useful for partial syncs

jobs:
  onboard-api:
    runs-on: ubuntu-latest
    name: Convert OpenAPI → Kong config & Sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup decK
        uses: kong/setup-deck@v1
        # Optionally pin a version:
        # with:
        #   deck-version: 1.40.0

      - name: Show decK version
        run: deck version

      - name: Convert OpenAPI → Kong declarative config
        run: |
          mkdir -p kong
          deck file openapi2kong \
            --spec "${{ env.OPENAPI_SPEC }}" \
            --output-file "${{ env.KONG_STATE_FILE }}" \
            --select-tag "${{ env.SELECT_TAG }}"
          echo "=== Generated Kong config ==="
          
          cat "${{ env.KONG_STATE_FILE }}"

      - name: Validate generated Kong configuration
        run: |
          deck file validate "${{ env.KONG_STATE_FILE }}"
          # Optional: lint with custom rules if you have them
          # deck file lint "${{ env.KONG_STATE_FILE }}"

      - name: Deep debug
        run: |
          echo "=== Deck version ==="
          deck version
      
          echo "Run curl command"
          echo "=== Testing with curl (same token) ==="
          curl -s -o /tmp/curl_out.txt -w "HTTP Status: %{http_code}\n" \
            -H "Authorization: Bearer kpat_4uVdljok8Vkf3awjPJ0Zi3IkFesO6pwUn3yUfEXO7NbAIv4Jo" \
            https://us.api.konghq.com/v2/control-planes
      
          echo "Curl response body:"
          cat /tmp/curl_out.txt
          echo ""
      
          echo "First === Testing deck ping with verbose ==="
          deck gateway ping \
            --konnect-token "kpat_4uVdljok8Vkf3awjPJ0Zi3IkFesO6pwUn3yUfEXO7NbAIv4Jo" \
            --konnect-addr "https://us.api.konghq.com" \
            --verbose 3 || true
            


      # ---------- Sync only on main (or manual) ----------
      - name: Sync Kong Config to Konnect
        run: |
          deck gateway sync -s kong/generated-kong.yaml \
            --konnect-addr "https://us.api.konghq.com" \
            --konnect-control-plane-name "serverless-api-gateway-demo" \
            --konnect-token "kpat_4uVdljok8Vkf3awjPJ0Zi3IkFesO6pwUn3yUfEXO7NbAIv4Jo"

      - name: Upload generated Kong config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kong-config
          path: ${{ env.KONG_STATE_FILE }}
